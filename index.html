<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>old-tools</title>
    <link rel="stylesheet" href="style.css">
    <style>
        html, body {
            height: auto;
            min-height: 100vh;
            overflow-y: auto;
            scroll-behavior: smooth;
            margin: 0;
            padding: 0;
        }
        
        .content-wrapper {
            min-height: 100vh;
            padding-bottom: 50px;
        }
        
        .spacing-element {
            height: 140px;
        }
        
        .spacing-element2 {
            height: 1000px;
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <h1>old-tools</h1>
        <!-- <p>...</p> -->
        <a href="https://old-tools.github.io/home/" target="_self" style="position: relative; z-index: 100;">
        Back ↗
        </a>
        
        <div class="spacing-element"></div>
        
        <div class="container">
            <div class="game-wrapper" style="width: 1940px; height: 1110px;">
                <iframe 
                    src="/osrscalc/calc/index.html" 
                    width="100%" 
                    height="100%"
                    frameborder="0"
                    allowfullscreen
                    style="border: none; display: block; width: 100%; height: 100%;">
                </iframe>
            </div>
        </div>
        
        <div class="spacing-element2"></div>
        
        <div id="giscus-container">
            <script src="https://giscus.app/client.js"
                    data-repo="old-tools/osrscalc"
                    data-repo-id="R_kgDOR9foSA"
                    data-category="General"
                    data-category-id="DIC_kwDOR9foSM4C8Fsx"
                    data-mapping="pathname"
                    data-strict="0"
                    data-reactions-enabled="1"
                    data-emit-metadata="0"
                    data-input-position="bottom"
                    data-theme="noborder_gray"
                    data-lang="en"
                    crossorigin="anonymous"
                    async>
            </script>
        </div>
    </div>
</body>
</html>
